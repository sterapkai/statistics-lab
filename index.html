<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>統計的推測ラボ</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>
<body>

<header>
<h1>📊 統計的推測ラボ</h1>
<p>50000人の母集団から標本調査</p>
</header>

<div class="container">

<div class="card">

<h2>抽出条件</h2>

標本数

<input id="sampleSize"
type="number"
value="100"
min="1">

<br><br>

性別

<select id="gender">
<option value="">全員</option>
<option value="男性">男性</option>
<option value="女性">女性</option>
</select>

<br><br>

年齢

<input id="minAge" type="number" value="0">

～

<input id="maxAge" type="number" value="120">

歳

<br><br>

睡眠時間

<input id="minSleep" type="number" value="0" step="0.1">

～

<input id="maxSleep" type="number" value="24" step="0.1">

時間

<br><br>

労働学業時間

<input id="minWork" type="number" value="0" step="0.1">

～

<input id="maxWork" type="number" value="24" step="0.1">

時間

<br><br>

<button onclick="runSample()">

標本抽出

</button>

</div>

<div class="card">

<h2>統計結果</h2>

<div id="summary">
CSV読込中...
</div>

</div>

<div class="card">

<h2>ヒストグラム</h2>

<select id="histTarget">

<option value="年齢">年齢</option>

<option value="身長_cm">身長</option>

<option value="睡眠時間_h">睡眠時間</option>

<option value="労働学業時間_h">労働学業時間</option>

</select>

<button onclick="updateHistogram()">

更新

</button>

<canvas id="histChart"></canvas>

</div>

<div class="card">

<h2>相関分析</h2>

<select id="scatterType">

<option value="age">

身長 × 年齢

</option>

<option value="sleep">

身長 × 睡眠時間

</option>

<option value="work">

身長 × 労働学業時間

</option>

</select>

<button onclick="drawRelationship()">

更新

</button>

<canvas id="relationChart"></canvas>

</div>

<div class="card">

<h2>標本データ一覧（最大100件）</h2>

<div id="tableArea"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
