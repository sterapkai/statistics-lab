<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計的推測ラボ</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<header>
<h1>📊 統計的推測ラボ</h1>
</header>

<div class="container">

<div class="panel">

<h2>標本抽出条件</h2>

<label>標本数</label>

<input
type="number"
id="sampleSize"
value="100"
min="1"
max="50000">

<br><br>

<select id="gender">

<option value="">
全員
</option>

<option value="男性">
男性
</option>

<option value="女性">
女性
</option>

</select>

<br><br>

最低年齢

<input
type="number"
id="minAge"
value="0">

最高年齢

<input
type="number"
id="maxAge"
value="120">

<br><br>

<button onclick="runSample()">
標本抽出
</button>

</div>

<div class="panel">

<h2>結果</h2>

<div id="result"></div>

</div>

<div class="panel">

<h2>抽出データ</h2>

<div id="tableArea"></div>

</div>

<div class="panel">

<h2>身長分布</h2>

<canvas id="histogram"></canvas>

</div>

<div class="panel">

<h2>年齢×身長</h2>

<canvas id="scatter"></canvas>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
